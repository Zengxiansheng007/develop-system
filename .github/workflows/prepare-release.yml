name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching VERSION, without v
        required: true
        type: string
      create_draft_release:
        description: Create a draft GitHub Release after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-checks.txt
      - run: python -B tools/checks.py --output-dir .scratch/release-verification
      - shell: bash
        run: python -B tools/release_bundle.py --version "$RELEASE_VERSION" --output-dir dist/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          path: dist/candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-checks-${{ matrix.os }}
          path: .scratch/release-verification/
          include-hidden-files: true
          if-no-files-found: error
  draft:
    if: inputs.create_draft_release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-ubuntu-latest
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: candidate-windows-latest
          path: dist/windows
      - name: Verify candidates agree
        shell: bash
        run: |
          (cd dist/linux && sha256sum --check SHA256SUMS)
          (cd dist/windows && sha256sum --check SHA256SUMS)
          cmp dist/linux/SHA256SUMS dist/windows/SHA256SUMS
      - name: Create draft from tested commit
        shell: bash
        run: gh release create "v$RELEASE_VERSION" "dist/linux/develop-system-$RELEASE_VERSION.zip" dist/linux/SHA256SUMS --repo "$GH_REPO" --target "$RELEASE_COMMIT" --draft --title "develop-system $RELEASE_VERSION" --notes-file CHANGELOG.md
